name: Fix portfolio production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix static portfolio assets and styling
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          if 'https://cdn.tailwindcss.com' not in s:
              marker = '<script id="tailwind-config">'
              s = s.replace(marker, '<script src="https://cdn.tailwindcss.com"></script>' + marker, 1)
              changed = True

          old = 'href="mailto:pvhari41@gmail.com"'
          new = 'href="assets/Hariharasudhan_P_Resume.pdf" download'
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          p.write_text(s, encoding='utf-8')

          helper = Path('patch.py')
          if helper.exists():
              helper.unlink()
              changed = True

          print('Portfolio fixes applied.' if changed else 'No changes needed.')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html patch.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix production portfolio styling and resume link"
            git push
          fi
