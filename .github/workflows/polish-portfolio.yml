name: Polish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Polish static portfolio
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              "I'm a B.Tech Information Technology student and developer building full-stack, AI-powered and voice-first products that connect technology with real-world needs. I don't just learn technology. I build with it.":
              "I'm a B.Tech Information Technology student and developer focused on full-stack development, AI-powered applications, and practical software products. I enjoy turning ideas into usable systems and learning by building.",
              "Open to opportunities": "Software Developer • AI Builder",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Improve metadata for sharing and search.
          marker = '<meta content="Portfolio of Hariharasudhan P — software developer, AI builder, and product engineer." name="description"/>'
          meta = marker + '''\n<meta property="og:title" content="Hariharasudhan P — Software Developer & AI Builder"/>\n<meta property="og:description" content="Portfolio of Hariharasudhan P — full-stack developer and AI builder."/>\n<meta property="og:type" content="website"/>\n<meta name="theme-color" content="#121317"/>'''
          s = s.replace(marker, meta) if 'og:title' not in s else s

          # Add a compact, evidence-first project index before the contact section.
          if 'id="project-evidence"' not in s:
              evidence = r'''
<section id="project-evidence" class="relative py-space-xl border-t border-outline-variant/20">
  <div class="flex flex-col gap-space-xl">
    <div class="flex flex-col gap-space-sm">
      <span class="font-label-mono text-label-mono uppercase tracking-wider text-primary">SELECTED WORK</span>
      <h2 class="font-headline-lg text-headline-lg text-on-surface">Projects I actually build.</h2>
      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">A concise view of my confirmed projects, with direct links to the source repositories and real product visuals where available.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-space-lg">
      <a href="https://github.com/Hari-maker-del/puthumai_ulavan" target="_blank" rel="noopener noreferrer" class="group rounded-xl overflow-hidden bg-surface-container-low border border-outline-variant/20 hover:border-primary/50 transition-all duration-300">
        <img src="assets/puthumai-dashboard.png" alt="Puthumai Ulavan dashboard" class="w-full aspect-[16/9] object-cover object-top group-hover:scale-[1.01] transition-transform duration-500" loading="lazy"/>
        <div class="p-space-lg"><div class="font-label-mono text-label-mono text-primary uppercase">Puthumai Ulavan</div><h3 class="font-headline-sm text-headline-sm text-on-surface mt-1">AI Farmer Co-Pilot</h3><p class="font-body-md text-body-md text-on-surface-variant mt-2">Crop planning, advisory, monitoring, and farm-management workflows.</p></div>
      </a>
      <a href="https://github.com/Hari-maker-del/cattlebreeddetecter" target="_blank" rel="noopener noreferrer" class="group rounded-xl bg-surface-container-low border border-outline-variant/20 hover:border-primary/50 transition-all duration-300 p-space-lg flex flex-col justify-between min-h-[260px]">
        <div><div class="font-label-mono text-label-mono text-primary uppercase">Cattle & Buffalo Classifier</div><h3 class="font-headline-sm text-headline-sm text-on-surface mt-1">Computer Vision Project</h3><p class="font-body-md text-body-md text-on-surface-variant mt-3">Image-based classification work focused on identifying cattle and buffalo breeds/types.</p></div><span class="font-label-mono text-label-mono text-on-surface-variant group-hover:text-primary">View repository →</span>
      </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-space-md">
      <a href="https://github.com/Hari-maker-del/vsb-noticeboard" target="_blank" rel="noopener noreferrer" class="rounded-lg bg-surface-container-low p-space-lg hover:bg-surface-container-high transition-colors"><div class="font-label-mono text-label-mono text-primary">01</div><h3 class="font-headline-sm text-headline-sm mt-2">VSB Noticeboard</h3><p class="font-body-md text-body-md text-on-surface-variant mt-2">College notice and information platform.</p></a>
      <a href="https://github.com/Hari-maker-del/AI-chatbox-college-enquiry" target="_blank" rel="noopener noreferrer" class="rounded-lg bg-surface-container-low p-space-lg hover:bg-surface-container-high transition-colors"><div class="font-label-mono text-label-mono text-primary">02</div><h3 class="font-headline-sm text-headline-sm mt-2">AI College Enquiry</h3><p class="font-body-md text-body-md text-on-surface-variant mt-2">AI-assisted college enquiry and information chatbot.</p></a>
      <a href="https://github.com/Hari-maker-del/runbook-following-agent" target="_blank" rel="noopener noreferrer" class="rounded-lg bg-surface-container-low p-space-lg hover:bg-surface-container-high transition-colors"><div class="font-label-mono text-label-mono text-primary">03</div><h3 class="font-headline-sm text-headline-sm mt-2">Runbook Following Agent</h3><p class="font-body-md text-body-md text-on-surface-variant mt-2">Agent workflow project for following structured operational runbooks.</p></a>
    </div>
  </div>
</section>
'''
              s = s.replace('</main>', evidence + '\n</main>', 1)

          # Add project evidence to the main navigation if it exists.
          s = s.replace('href="#work">Projects</a>', 'href="#project-evidence">Projects</a>')

          # Accessibility and interaction polish.
          if 'focus-visible:ring-2' not in s:
              s = s.replace('<style>@layer base {', '<style>a:focus-visible,button:focus-visible { outline: none; box-shadow: 0 0 0 2px #d0bcff; border-radius: 6px; } @layer base {', 1)

          p.write_text(s, encoding='utf-8')

          # Remove the old one-off patch helper from the public repo.
          patch = Path('patch.py')
          if patch.exists():
              patch.unlink()
      - name: Update README
        shell: bash
        run: |
          cat > README.md <<'EOF'
# Hariharasudhan P — Portfolio

Personal portfolio for Hariharasudhan P, a B.Tech Information Technology student and software/AI builder.

## Confirmed projects

- [VSB Noticeboard](https://github.com/Hari-maker-del/vsb-noticeboard)
- [AI College Enquiry](https://github.com/Hari-maker-del/AI-chatbox-college-enquiry)
- [Puthumai Ulavan](https://github.com/Hari-maker-del/puthumai_ulavan)
- [Runbook Following Agent](https://github.com/Hari-maker-del/runbook-following-agent)
- [Cattle & Buffalo Classifier](https://github.com/Hari-maker-del/cattlebreeddetecter)

## Stack

C, C++, Java, Python, TypeScript, HTML, CSS, React, FastAPI, Supabase, MySQL, Git and GitHub.

## Deployment

The portfolio is a static HTML site deployed on Vercel and connected to this GitHub repository.
EOF
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md patch.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Polish portfolio and project showcase [portfolio-polish]"
            git push
          fi
