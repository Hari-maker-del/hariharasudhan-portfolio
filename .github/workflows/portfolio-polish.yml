name: Polish portfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final copy and UX polish
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'I build software that solves \n            <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-primary-container">real problems.</span>': 'I build software, AI systems, and products that solve \n            <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-primary-container">real problems.</span>',
              'A focused arsenal calibrated for speed, architectural integrity, and developer velocity.': 'A practical set of technologies I use across web development, AI, automation, and computer vision.',
              'Zero patience for empty hype. Absolute commitment to engineering that delivers tangible value to end-users.': 'I care about practical engineering, continuous learning, and building software that is useful to real people.',
              'Building a strong foundation in software engineering, data structures, databases, and practical application development.': 'Building a strong foundation in software engineering, data structures, databases, and practical application development while turning coursework into working projects.',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # Keep the portfolio self-contained and avoid misleading status language.
          s = s.replace('Available for opportunities', 'Open to opportunities')

          p.write_text(s, encoding='utf-8')

      - name: Commit polished portfolio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No polish changes needed."
          else
            git commit -m "Polish portfolio copy and UX"
            git push
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/portfolio-polish.yml
          git add .github/workflows/portfolio-polish.yml
          if git diff --cached --quiet; then
            echo "Temporary workflow already removed."
          else
            git commit -m "Remove temporary portfolio polish workflow"
            git push
          fi
